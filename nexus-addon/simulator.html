<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Accounting — Combat Simulator</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="simulator.css" />
</head>
<body>
  <h1>Combat Simulator</h1>

  <div class="status-bar">
    <a href="dashboard.html" style="color:#58a6ff;">← Back to dashboard</a>
    <span id="sim-status"></span>
  </div>

  <div class="sim-options">
    <button id="btn-run">Simulate battle</button>
    <button id="btn-clear">Clear fleets</button>
  </div>

  <div class="sim-layout">
    <div class="fleet-box">
      <h2 class="fleet-title attacker">Attacker fleet</h2>
      <div class="load-fleet-bar">
        <select id="attacker-type" class="inline-btn" title="Fleet owner or faction">
          <option value="player">Player</option>
          <option value="npc">NPC</option>
          <option value="pirate">Pirate</option>
        </select>
        <span id="attacker-zone-wrap" style="display:none;"><select id="attacker-zone" class="inline-btn"></select></span>
        <select id="fleet-planet" class="inline-btn" title="Planet to import ships from">
          <option value="home">Home planet</option>
        </select>
        <select id="fleet-class" class="inline-btn" title="Filter by ship class">
          <option value="">All classes</option>
        </select>
        <button id="btn-load-fleet" class="inline-btn">Load my fleet</button>
      </div>
      <div class="coord-bar">
        <span class="coord-label">Origin system</span>
        <input id="atk-system" type="text" class="coord-input" placeholder="e.g. A12-27" />
      </div>
      <div id="attacker-player-opts" class="tech-panel">
        <label class="checkbox-label"><input id="attacker-own-bonuses" type="checkbox" checked /> Use my own research and bonuses</label>
        <label class="checkbox-label"><input id="attacker-leadership" type="checkbox" /> Attach my leadership</label>
        <div class="tech-grid" id="attacker-bonuses"></div>
      </div>
      <table class="fleet-table"><tbody id="attacker-ships"></tbody></table>
    </div>

    <div class="fleet-box">
      <h2 class="fleet-title defender">Defender fleet</h2>
      <div class="load-fleet-bar">
        <select id="defender-type" class="inline-btn" title="Fleet owner or faction">
          <option value="player">Player</option>
          <option value="npc">NPC</option>
          <option value="pirate">Pirate</option>
        </select>
        <span id="defender-zone-wrap" style="display:none;"><select id="defender-zone" class="inline-btn"></select></span>
        <select id="report-select" class="inline-btn" style="max-width:280px;">
          <option value="">Fill from intel report…</option>
        </select>
      </div>
      <div class="coord-bar">
        <span class="coord-label">Target system</span>
        <input id="def-system" type="text" class="coord-input" placeholder="e.g. G35-41" />
        <span id="distance-display" class="coord-distance"></span>
      </div>
      <div id="defender-player-opts" class="tech-panel">
        <label class="checkbox-label"><input id="defender-own-bonuses" type="checkbox" /> Use my own research and bonuses</label>
        <label class="checkbox-label"><input id="defender-leadership" type="checkbox" /> Attach my leadership</label>
        <div class="tech-grid" id="defender-bonuses"></div>
      </div>
      <div id="defender-defense-box" class="tech-panel">
        <div class="tech-grid" id="defender-defense"></div>
        <div class="tech-grid">
          <label>Building HP bonus % <input id="def-building-hp-bonus" type="number" class="tech-input" step="0.1" placeholder="0" /></label>
          <label>Planetary defence bonus % <input id="def-planetary-bonus" type="number" class="tech-input" step="0.1" placeholder="0" /></label>
        </div>
      </div>
      <div id="target-intel" style="display:none;" class="tech-panel"></div>
      <table class="fleet-table"><tbody id="defender-ships"></tbody></table>
    </div>
  </div>

  <div id="results" style="display:none;">
    <div class="section-label">Battle outcome</div>
    <div class="stats" id="outcome-stats"></div>
    <div class="sim-fleet-results" id="fleet-results"></div>
    <div class="sim-rounds">
      <h3 class="sim-rounds-heading">Combat rounds <span id="rounds-count"></span></h3>
      <div class="sim-rounds-list" id="rounds-log"></div>
    </div>
    <div class="sim-layout">
      <div><div class="section-label">Attacker losses</div><div class="sim-loss-rows" id="attacker-losses"></div></div>
      <div><div class="section-label">Defender losses</div><div class="sim-loss-rows" id="defender-losses"></div></div>
    </div>
    <div class="section-label">Debris generated</div>
    <div class="stats" id="debris-stats"></div>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="server-storage.js"></script>
  <script type="module" src="simulator.js"></script>
</body>
</html>
